<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
    <table style="border: 1px solid black">
        <tr th:if="${listaProductos.size() == 0}">
            <div class="alert alert-warning">
                No hay productos
            </div>
        </tr>
        <div th:unless="${listaProductos.isEmpty()}">
            <tr th:each="producto : ${listaProductos}">

                <td><span th:text="${producto.nombre}"></span></td>
                <td><span th:text="${producto.precio}"></span></td>
                <td><span th:text="${producto.categoria}"></span></td>
                <td th:href="@{/verDetalle}">Ver detalle<span></span></td>
            </tr>
        </div>

    </table>
</body>
</html>
