<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Formulario</h1>
    <form th:object="${producto}" action="/formulario" method="post">
        <input type="hidden" th:field="*{id}">

        <label>Nombre</label> <input th:field="*{nombre}" /><br>
        <label>Precio </label> <input th:field="*{precio}" /><br>
        <label>Categoria </label> <input th:field="*{categoria}" /><br>
        <input type="submit" value="enviar">
    </form>
</body>
</html>
